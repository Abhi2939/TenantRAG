<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">TenantRAG architecture</title>
  <desc id="d">A tenant client calls an API gateway, which routes to ingest, query and training services. The query service calls a model server. All services use tenant-scoped state: pgvector, Postgres, an object store and a job queue. Solid boxes are built in Phase 1; dashed boxes are planned for Phases 2 to 5.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="489" rx="12" fill="#0D1117" stroke="#30363D"/>

  <!-- Client -->
  <rect x="320" y="24" width="180" height="44" rx="8" fill="#21262D" stroke="#8B949E"/>
  <text x="410" y="46" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#E6EDF3">Tenant client</text>

  <line x1="410" y1="68" x2="410" y2="102" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="280" y="104" width="260" height="60" rx="8" fill="#0B2E27" stroke="#2FBF9B"/>
  <text x="410" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#7FE3C8">API gateway</text>
  <text x="410" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2FBF9B">FastAPI; auth, limits later</text>

  <!-- Fan-out bar -->
  <line x1="410" y1="164" x2="410" y2="186" stroke="#8B949E" stroke-width="1.5"/>
  <line x1="110" y1="186" x2="410" y2="186" stroke="#8B949E" stroke-width="1.5"/>
  <line x1="410" y1="186" x2="710" y2="186" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="110" y1="186" x2="110" y2="210" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="186" x2="310" y2="210" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="186" x2="710" y2="210" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Services row -->
  <rect x="25" y="212" width="170" height="60" rx="8" fill="#0B2E27" stroke="#2FBF9B"/>
  <text x="110" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#7FE3C8">Ingest worker</text>
  <text x="110" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2FBF9B">Chunk and embed</text>

  <rect x="225" y="212" width="170" height="60" rx="8" fill="#0B2E27" stroke="#2FBF9B"/>
  <text x="310" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#7FE3C8">Query service</text>
  <text x="310" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2FBF9B">Retrieve + answer</text>

  <rect x="425" y="212" width="170" height="60" rx="8" fill="#1F1B4D" stroke="#8B83F0"/>
  <text x="510" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#C4BFFB">Model server</text>
  <text x="510" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B83F0">Groq now, vLLM later</text>

  <rect x="625" y="212" width="170" height="60" rx="8" fill="#1F1B4D" stroke="#8B83F0" stroke-dasharray="5 4"/>
  <text x="710" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#C4BFFB">Training worker</text>
  <text x="710" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B83F0">LoRA jobs</text>

  <!-- Query -> model server -->
  <line x1="397" y1="242" x2="423" y2="242" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Services -> state -->
  <line x1="110" y1="274" x2="110" y2="310" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="274" x2="310" y2="310" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="274" x2="510" y2="310" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="710" y1="274" x2="710" y2="310" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- State container -->
  <rect x="15" y="312" width="790" height="120" rx="12" fill="none" stroke="#6E7681" stroke-dasharray="4 4"/>
  <text x="35" y="332" dominant-baseline="central" font-size="13" font-weight="600" fill="#E6EDF3">Tenant-scoped state</text>

  <rect x="25" y="350" width="170" height="60" rx="8" fill="#21262D" stroke="#8B949E"/>
  <text x="110" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#E6EDF3">pgvector</text>
  <text x="110" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B949E">Chunks + embeddings</text>

  <rect x="225" y="350" width="170" height="60" rx="8" fill="#21262D" stroke="#8B949E"/>
  <text x="310" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#E6EDF3">Postgres</text>
  <text x="310" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B949E">Docs now, tenants later</text>

  <rect x="425" y="350" width="170" height="60" rx="8" fill="#21262D" stroke="#8B949E" stroke-dasharray="5 4"/>
  <text x="510" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#E6EDF3">Object store</text>
  <text x="510" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B949E">Docs, adapters (MinIO)</text>

  <rect x="625" y="350" width="170" height="60" rx="8" fill="#21262D" stroke="#8B949E" stroke-dasharray="5 4"/>
  <text x="710" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#E6EDF3">Job queue</text>
  <text x="710" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8B949E">Redis</text>

  <!-- Legend -->
  <rect x="25" y="455" width="28" height="16" rx="4" fill="#21262D" stroke="#8B949E"/>
  <text x="61" y="463" dominant-baseline="central" font-size="12" fill="#8B949E">Built in Phase 1</text>
  <rect x="185" y="455" width="28" height="16" rx="4" fill="#21262D" stroke="#8B949E" stroke-dasharray="5 4"/>
  <text x="221" y="463" dominant-baseline="central" font-size="12" fill="#8B949E">Planned (Phases 2 to 5)</text>
  <rect x="385" y="455" width="28" height="16" rx="4" fill="#0B2E27" stroke="#2FBF9B"/>
  <text x="421" y="463" dominant-baseline="central" font-size="12" fill="#8B949E">Services</text>
  <rect x="485" y="455" width="28" height="16" rx="4" fill="#1F1B4D" stroke="#8B83F0"/>
  <text x="521" y="463" dominant-baseline="central" font-size="12" fill="#8B949E">ML compute</text>
  <rect x="610" y="455" width="28" height="16" rx="4" fill="#21262D" stroke="#8B949E"/>
  <text x="646" y="463" dominant-baseline="central" font-size="12" fill="#8B949E">Storage</text>
</svg>
