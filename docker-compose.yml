services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tenantrag
      POSTGRES_PASSWORD: tenantrag
      POSTGRES_DB: tenantrag
    ports:
      - "5433:5432"   # host port 5433 so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first start of an empty volume: creates the extension and schema.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantrag -d tenantrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env            # provides GROQ_API_KEY and any other settings
    environment:
      # Overrides any DATABASE_URL in .env (which may point at Supabase) so the
      # container talks to the db service above.
      DATABASE_URL: postgresql://tenantrag:tenantrag@db:5432/tenantrag
    volumes:
      # Keep the downloaded embedding model between rebuilds.
      # If your embed.py caches elsewhere, adjust this path.
      - modelcache:/root/.cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  modelcache: